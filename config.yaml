# 可変パラメータ。コードに直書きしない（AGENTS.md §5）
ollama:
  host: "http://localhost:11434"
  # 2026-11-09 論点4: 小型モデルを前提にする（7B は 8GB 機でタイムアウト、3B は2問目以降12〜17秒の実測）。
  # 最終的なモデルは評価セットで 3B / 7B / ほかの候補を比べて決め、決まったら AGENTS.md §2 を更新する
  llm: "qwen2.5:3b"
  embed: "bge-m3"
  num_ctx: 4096      # プロンプト実測937トークン。8192はKVキャッシュがメモリを圧迫する（8GB機）
  temperature: 0
  seed: 42
  # 時間切れは棄却として扱う（論点4）。未検証の条文を見せないため、待たせるより断る
  timeout_sec: 60
  # モデルをメモリに置いたままにする時間。Ollama の既定（5分）だと、しばらく質問が無いと手放され、
  # 次の1問目が読み込みで約90秒かかる（11/8 実測）。-1 は無期限
  keep_alive: -1
  # 生成するトークン数の上限。JSON（引用番号＋1文の回答＋判定）に十分な長さ。超えると JSON が壊れて棄却される
  num_predict: 256

retrieve:
  top_k: 5
  rrf_k: 60          # RRF は並べ替え専用。閾値判定には使わない
  max_chunks_per_article: 2   # 同一条文が上位を食い潰さないように

gate:
  # ゲート1: 絶対スケールを持つ生スコアで判定する（RRF融合スコアは順位ベースで閾値化できない）
  tau_cos: 0.60      # 暫定値。回答可能8問の最小0.623 と 回答不能8問の最大0.566 の間に設定
                     # ★校正セットと測定セットが同一のため、これは「測定」ではない。規程15本が揃い次第に再校正
  # 質問の内容語のうち、規程に存在しない語の割合がこれを超えたら棄却。
  # 0.99 = 「内容語が1語も規程に存在しない」場合のみ棄却する、の意。
  #
  # 0.5 のような厳しい値にすると「泊まりの出張だといくらもらえる？」のような口語表現が
  # 棄却される（泊まり・いくら・もらえる がすべて規程語彙に無いため）。
  # これは意味検索で拾うべき質問なので、語彙ゲートで落としてはならない。
  # 語彙ゲートは「副業」「ハラスメント」のように完全に無関係な話題を確実に落とす補助であり、
  # 主判定は tau_cos が担う。規程が15本揃えば語彙が厚くなるので、この値は再校正する。
  max_oov_ratio: 0.99

  # ゲート2の数値照合（2026-11-09 論点1）。回答中の「数＋単位」は、引用した条文に同じ「数＋単位」が
  # 無ければ棄却する。キーが正規の単位、値はその別表記。漢数字・全角は算用数字・半角にそろえてから照合する。
  # 「分」は入れない（「十分な」が「10分」と読まれて誤って棄却されるため）。
  number_units:
    円: []
    日: [日間]
    か月: [ヶ月, ケ月, カ月, ヵ月, 箇月, か月間, ヶ月間]
    年: [年間]
    週: [週間]
    回: []
    時間: []
    時: []
    泊: []
    km: [キロメートル, キロ]
    "%": []
    割: []
    倍: []
    名: [人]
    歳: [才]
  # 表の行ラベル照合（論点2）で、「社長・会長・役員」のようなセルを「・」で区切った各語をラベルにする最短の文字数。
  # セル全体の値は長さによらずラベルにする（職級を漢字1文字で略記した表があるため）
  table_label_min_chars: 2

split:
  max_chars: 1200    # これを超える条文は項単位に再分割

# 原本PDFでの該当箇所の表示（取込の正本は Word。PDF は見せるためだけに使う）
source_view:
  key_chars: 20          # 条文の開始位置を探すときに使う冒頭の文字数（第N条＋本文の書き出し）
  segment_chars: 12      # 行が丸ごと一致しないとき（ページ境界など）に区切って照合する長さ
  min_match_ratio: 0.6   # 本文のこの割合以上が一致したら色付けする。下回れば条文の開始ページだけを色付けなしで示す
  render_scale: 2.0      # 描画倍率。A4 で幅約1190px

# 生成のプロンプト（AGENTS.md §5: プロンプトはコードに直書きしない）。{context} と {question} が差し込まれる
# 2026-11-09 論点4: 回答を1文に短くし、数字を条文の表記のまま書かせる規則（7・8）を追加
prompt:
  system: |
    あなたは社内規程の内容だけを答える案内係です。次の規則を必ず守ってください。

    1. 以下に示した条文以外の知識を使用してはならない。
    2. 一般的な労働基準法や世間の慣行に基づく補足を行ってはならない。
    3. sufficient を false にしてよいのは、**示された条文にその事項の記載がない場合だけ**である。
    4. 条文に職級・区分・条件による場合分けがある場合は、
       **場合分けごとにすべて列挙して回答する**こと。
       質問が特定の条件（職級など）を指定していないことは、false にする理由にならない。
       **場合分けを列挙して回答できたなら、sufficient は true である。**
    5. citation_ids には、根拠とした条文の番号（[1] などの番号）だけを入れること。
    6. 回答に金額を書く場合、その金額は citation_ids で挙げた条文の中に必ず書かれていなければならない。
       条文に無い金額を計算したり推測したりしてはならない。
    7. answer は結論だけを1文で書くこと。理由・前置き・条文の言い換えは書かない（根拠は画面で原本を示す）。
       場合分けがある場合は「（区分）: （数字と単位）」を読点で並べる。
    8. 数字は条文に書かれている数字と単位をそのまま書くこと。言い換え（「7日」を「1週間」）や計算をしてはならない。
    9. 出力は citation_ids → answer → sufficient の順に組み立てること。
       まず根拠となる条文を挙げ、次にその条文だけを使って回答を書き、
       最後に「その回答が挙げた条文だけで成り立っているか」を sufficient で答える。

    条文:
    {context}

    質問: {question}

ui:
  title: "社内規程 確認"
  # 質問例。必ず「回答される」ことを確認したものだけを置く（棄却される例を置くと、何を聞けるシステムかが伝わらない）
  # 2026-10-02 に3問とも answered を確認（旅費規程1本の時点）
  examples:
    - "出張の日当はいくらですか"
    - "宿泊費の上限はいくらですか"
    - "出張旅費の精算はいつまでに行いますか"
