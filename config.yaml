# 可変パラメータ。コードに直書きしない（AGENTS.md §5）
ollama:
  host: "http://localhost:11434"
  llm: "qwen2.5:7b"
  embed: "bge-m3"
  num_ctx: 4096      # プロンプト実測937トークン。8192はKVキャッシュがメモリを圧迫する（8GB機）
  temperature: 0
  seed: 42
  timeout_sec: 180

retrieve:
  top_k: 5
  rrf_k: 60          # RRF は並べ替え専用。閾値判定には使わない
  max_chunks_per_article: 2   # 同一条文が上位を食い潰さないように

gate:
  # ゲート1: 絶対スケールを持つ生スコアで判定する（RRF融合スコアは順位ベースで閾値化できない）
  tau_cos: 0.60      # 暫定値。回答可能8問の最小0.623 と 回答不能8問の最大0.566 の間に設定
                     # ★校正セットと測定セットが同一のため、これは「測定」ではない。規程15本が揃い次第に再校正
  # 質問の内容語のうち、規程に存在しない語の割合がこれを超えたら棄却。
  # 0.99 = 「内容語が1語も規程に存在しない」場合のみ棄却する、の意。
  #
  # 0.5 のような厳しい値にすると「泊まりの出張だといくらもらえる？」のような口語表現が
  # 棄却される（泊まり・いくら・もらえる がすべて規程語彙に無いため）。
  # これは意味検索で拾うべき質問なので、語彙ゲートで落としてはならない。
  # 語彙ゲートは「副業」「ハラスメント」のように完全に無関係な話題を確実に落とす補助であり、
  # 主判定は tau_cos が担う。規程が15本揃えば語彙が厚くなるので、この値は再校正する。
  max_oov_ratio: 0.99

split:
  max_chars: 1200    # これを超える条文は項単位に再分割
