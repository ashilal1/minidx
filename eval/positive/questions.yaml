# 回答可能質問（要件定義 §5.1: 15問。開発仕様 §3 の質問例を含める）
#
# ★ 書くのは人。規程本文を手元で読み、正解の条番号を確かめてから書く ★
#   規程本文を外部の AI サービス（Claude / ChatGPT など）に読ませて作らない（AGENTS.md §6）。
#
# 書いてよいもの: 質問文、正解の規程名と条番号
# 書かないもの  : 金額・日数など条文の中身（このファイルは git 管理下）
#
# expected:
#   document … 規程名の一部（例: 旅費規程）。改訂日の表記が変わっても一致するよう部分一致で照合する
#   locator  … 条番号（例: 第14条）。"第14条 表1" や "第14条第2項" も正解として扱う
#              複数の条で答えられる質問は expected を複数書く（どれか1つが引用されれば正解）
#
# split:
#   calib   … 閾値の校正に使う。何度見てもよい
#   holdout … 一度だけ測る（eval/README.md）。calib と同じ内容の言い換えを入れない
#   目安は calib 10問 / holdout 5問
#
# 入れておきたい観点（docs/research/2026-11-09_ローカルLLM-RAG記事調査.md §4.2）:
#   - 表を引く質問（職級ごとの金額など）と、職級を指定した質問の両方
#   - 期限・日数を答える質問（論点1の数値照合の確認）
#   - 口語の言い換え（「泊まり」「ホテル代」など。規程の語をそのまま使わない）
#   - 規程が増えたら、複数の規程にまたがる語を含む質問

questions:
  # 記入例（質問文は config.yaml の ui.examples と同じ。正解の条番号は条見出しから仮に置いたもの。要確認）
  - {id: p01, split: calib, question: 出張の日当はいくらですか,
     expected: [{document: 旅費規程, locator: 第14条}]}
  - {id: p02, split: calib, question: 宿泊費の上限はいくらですか,
     expected: [{document: 旅費規程, locator: 第13条}]}
  # - {id: p03, split: calib, question: ここに質問文, expected: [{document: 旅費規程, locator: 第N条}]}
